name: PowerShell Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'Tests/**'
      - '.github/workflows/powershell-quality.yml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'Tests/**'
      - '.github/workflows/powershell-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Quality - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = @(
              Invoke-ScriptAnalyzer `
                  -Path . `
                  -Recurse `
                  -Settings ./PSScriptAnalyzerSettings.psd1
          )

          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer returned $($findings.Count) finding(s)."
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./Tests -CI -Output Detailed

      - name: Run portfolio smoke test
        shell: pwsh
        run: |
          ./Invoke-StudentProvisioning.ps1
